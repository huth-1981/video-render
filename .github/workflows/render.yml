name: Render and Post Video

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Chon kenh'
        required: true
        type: choice
        options: [chuyen_tham_60s, sao_lai_the, viet_nam_nhin_tu_tren, song_khoe_sau_50, the_gioi_hoang_da_60s, loi_phat_day_1_phut, tien_trong_tui, thanh_lam_3d_studio, ha_thu_cartoon_studio, da_thuy_3d_studio]
      mode:
        description: 'Che do render: video = nhu cu, image_card = anh EN/VI/IPA'
        required: false
        default: 'video'
        type: choice
        options: [video, image_card]
      script:
        description: 'Noi dung kich ban'
        required: true
        type: string
      video_url:
        description: '1 hoac nhieu link Pexels cach nhau dau phay ,'
        required: false
        type: string
      title:
        description: 'Tieu de video'
        required: true
        type: string
      content_vi:
        description: 'Noi dung tieng Viet'
        required: false
        type: string
      content_en:
        description: 'Noi dung tieng Anh'
        required: false
        type: string
      ipa:
        description: 'Phien am IPA'
        required: false
        type: string
      vocab:
        description: 'Tu vung'
        required: false
        type: string
      hook:
        description: 'Hook'
        required: false
        type: string
      fb_formatted:
        description: 'Noi dung FB da format'
        required: false
        type: string
      video_order:
        description: 'Thu tu video'
        required: false
        type: string
      scheduled_at:
        description: 'Thoi gian du kien'
        required: false
        type: string
      story_id:
        description: 'Story ID'
        required: false
        type: string

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core && pip install edge-tts requests Pillow

      - id: get_token
        run: |
          # Lay token va page_id - ho tro ca SECRETS va VARS
          case "${{ inputs.channel }}" in
            chuyen_tham_60s)
              echo "page_token=${{ secrets.FB_TOKEN_CHUYEN_THAM_60S }}" >> $GITHUB_OUTPUT
              # Thu lay page_id tu secrets truoc, neu khong co thi lay tu vars
              PID="${{ secrets.FB_PAGE_ID_CHUYEN_THAM_60S }}${{ vars.FB_PAGE_ID_CHUYEN_THAM_60S }}"
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            sao_lai_the)
              echo "page_token=${{ secrets.FB_TOKEN_SAO_LAI_THE }}" >> $GITHUB_OUTPUT
              PID="${{ secrets.FB_PAGE_ID_SAO_LAI_THE }}${{ vars.FB_PAGE_ID_SAO_LAI_THE }}"
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            viet_nam_nhin_tu_tren)
              echo "page_token=${{ secrets.FB_TOKEN_VIET_NAM_NHIN_TU_TREN }}" >> $GITHUB_OUTPUT
              PID="${{ secrets.FB_PAGE_ID_VIET_NAM_NHIN_TU_TREN }}${{ vars.FB_PAGE_ID_VIET_NAM_NHIN_TU_TREN }}"
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            song_khoe_sau_50)
              echo "page_token=${{ secrets.FB_TOKEN_SONG_KHOE_SAU_50 }}" >> $GITHUB_OUTPUT
              PID="${{ secrets.FB_PAGE_ID_SONG_KHOE_SAU_50 }}${{ vars.FB_PAGE_ID_SONG_KHOE_SAU_50 }}"
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            the_gioi_hoang_da_60s)
              echo "page_token=${{ secrets.FB_TOKEN_THE_GIOI_HOANG_DA_60S }}" >> $GITHUB_OUTPUT
              PID="${{ secrets.FB_PAGE_ID_THE_GIOI_HOANG_DA_60S }}${{ vars.FB_PAGE_ID_THE_GIOI_HOANG_DA_60S }}"
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            loi_phat_day_1_phut)
              echo "page_token=${{ secrets.FB_TOKEN_LOI_PHAT_DAY_1_PHUT }}" >> $GITHUB_OUTPUT
              PID="${{ secrets.FB_PAGE_ID_LOI_PHAT_DAY_1_PHUT }}${{ vars.FB_PAGE_ID_LOI_PHAT_DAY_1_PHUT }}"
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            tien_trong_tui)
              echo "page_token=${{ secrets.FB_TOKEN_TIEN_TRONG_TUI }}" >> $GITHUB_OUTPUT
              PID="${{ secrets.FB_PAGE_ID_TIEN_TRONG_TUI }}${{ vars.FB_PAGE_ID_TIEN_TRONG_TUI }}"
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            thanh_lam_3d_studio)
              # 3 kenh moi - lay tu nhieu ten khac nhau de tranh loi dat ten
              TOKEN="${{ secrets.FB_PAGE_TOKEN_THANH_LAM_3D_STUDIO }}${{ secrets.FB_TOKEN_THANH_LAM_3D_STUDIO }}${{ secrets.FB_TOKEN_THANH_LAM }}"
              PID="${{ secrets.FB_PAGE_ID_THANH_LAM_3D_STUDIO }}${{ vars.FB_PAGE_ID_THANH_LAM_3D_STUDIO }}${{ secrets.FB_PAGE_ID_THANH_LAM }}${{ vars.FB_PAGE_ID_THANH_LAM }}"
              echo "page_token=$TOKEN" >> $GITHUB_OUTPUT
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              echo "DEBUG channel=thanh_lam_3d_studio page_id_len=${#PID} token_len=${#TOKEN}"
              ;;
            ha_thu_cartoon_studio)
              TOKEN="${{ secrets.FB_PAGE_TOKEN_HA_THU_CARTOON_STUDIO }}${{ secrets.FB_TOKEN_HA_THU_CARTOON_STUDIO }}${{ secrets.FB_TOKEN_HA_THU }}"
              PID="${{ secrets.FB_PAGE_ID_HA_THU_CARTOON_STUDIO }}${{ vars.FB_PAGE_ID_HA_THU_CARTOON_STUDIO }}${{ secrets.FB_PAGE_ID_HA_THU }}${{ vars.FB_PAGE_ID_HA_THU }}"
              echo "page_token=$TOKEN" >> $GITHUB_OUTPUT
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
            da_thuy_3d_studio)
              TOKEN="${{ secrets.FB_PAGE_TOKEN_DA_THUY_3D_STUDIO }}${{ secrets.FB_TOKEN_DA_THUY_3D_STUDIO }}${{ secrets.FB_TOKEN_DA_THUY }}"
              PID="${{ secrets.FB_PAGE_ID_DA_THUY_3D_STUDIO }}${{ vars.FB_PAGE_ID_DA_THUY_3D_STUDIO }}${{ secrets.FB_PAGE_ID_DA_THUY }}${{ vars.FB_PAGE_ID_DA_THUY }}"
              echo "page_token=$TOKEN" >> $GITHUB_OUTPUT
              echo "page_id=$PID" >> $GITHUB_OUTPUT
              ;;
          esac
          # In ra debug (khong lo token)
          echo "Channel: ${{ inputs.channel }}"
          cat $GITHUB_OUTPUT | sed 's/page_token.*/page_token=***HIDDEN***/'

      - name: Render - Ghep 3 video & khong cat tieng
        if: ${{ inputs.mode == 'video' || inputs.mode == '' }}
        run: |
          echo '${{ inputs.script }}' > script.txt
          edge-tts --voice vi-VN-HoaiMyNeural --text "$(cat script.txt)" --write-media voice.mp3
          echo "${{ inputs.video_url }}" | tr ',' '\n' > urls.txt
          rm -f list.txt
          i=0
          for url in $(cat urls.txt); do
            echo "Tai video $i: $url"
            curl -L -o clip_${i}_raw.mp4 $url
            ffmpeg -y -i clip_${i}_raw.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -pix_fmt yuv420p -an clip_${i}.mp4
            echo "file clip_${i}.mp4" >> list.txt
            i=$((i+1))
          done
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy bg_concat.mp4
          ffmpeg -y -stream_loop 10 -i bg_concat.mp4 -i voice.mp3 -shortest -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:a aac -c:v libx264 -pix_fmt yuv420p -max_muxing_queue_size 1024 final.mp4

      - name: Render - Anh Flashcard EN/VI/IPA
        if: ${{ inputs.mode == 'image_card' }}
        env:
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
          CONTENT_EN: ${{ inputs.content_en }}
          CONTENT_VI: ${{ inputs.content_vi }}
          IPA: ${{ inputs.ipa }}
          VOCAB: ${{ inputs.vocab }}
          HOOK: ${{ inputs.hook }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os, textwrap

          W, H = 1080, 1920
          TITLE = os.getenv("TITLE","")
          EN = os.getenv("CONTENT_EN","") or os.getenv("SCRIPT","")
          VI = os.getenv("CONTENT_VI","")
          IPA = os.getenv("IPA","")
          VOCAB = os.getenv("VOCAB","")
          HOOK = os.getenv("HOOK","")

          def get_font(size, bold=False):
              p = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              try: return ImageFont.truetype(p, size)
              except: return ImageFont.load_default()

          img = Image.new("RGB", (W,H), (15,23,42))
          draw = ImageDraw.Draw(img)
          draw.rectangle([0,0,W,950], fill=(30,41,59))
          draw.ellipse([-100,-100,400,400], fill=(56,189,248,30))
          draw.ellipse([700,100,1200,600], fill=(168,85,247,30))
          draw.rounded_rectangle([40, 900, W-40, H-40], radius=32, fill=(255,255,255))

          y=940
          def wrapped(text, y, font, color, left=80):
              if not text: return y
              lines = textwrap.wrap(text, width=38)
              for line in lines:
                  draw.text((left, y), line, font=font, fill=color)
                  y+= font.size + 14
                  if y> H-120: break
              return y

          fb_b = get_font(44, True)
          fb_m = get_font(36)
          fb_s = get_font(30)

          if TITLE:
              y = wrapped(TITLE, y, fb_b, (15,23,42))
              y+=12
              draw.line([(80,y),(W-80,y)], fill=(226,232,240), width=2)
              y+=24
          if EN:
              y = wrapped(f"EN: {EN}", y, fb_b, (15,23,42))
              y+=16
          if VI:
              y = wrapped(f"VI: {VI}", y, fb_m, (51,65,85))
              y+=16
          if IPA:
              y = wrapped(f"IPA: {IPA}", y, fb_s, (100,116,139))
              y+=16
          if VOCAB:
              y = wrapped(f"Vocab: {VOCAB}", y, fb_s, (14,165,233))
              y+=16
          if HOOK:
              y+=10
              draw.line([(80,y),(W-80,y)], fill=(226,232,240), width=2)
              y+=20
              y = wrapped(HOOK, y, fb_s, (100,116,139))

          import os
          os.makedirs("output", exist_ok=True)
          img.save("output/card.jpg", quality=95)
          img.save("final.jpg", quality=95)
          print("Saved final.jpg")
          PY

      - name: Post - Cong khai cho moi nguoi xem
        env:
          PAGE_TOKEN: ${{ steps.get_token.outputs.page_token }}
          PAGE_ID: ${{ steps.get_token.outputs.page_id }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 << 'PY'
          import requests, os, time, sys

          pid = os.environ.get("PAGE_ID", "").strip()
          token = os.environ.get("PAGE_TOKEN", "").strip()
          mode = os.environ.get("MODE","video") or "video"
          title = """${{ inputs.title }}"""
          script = """${{ inputs.script }}"""
          content_en = """${{ inputs.content_en }}"""
          content_vi = """${{ inputs.content_vi }}"""
          ipa = """${{ inputs.ipa }}"""
          vocab = """${{ inputs.vocab }}"""
          hook = """${{ inputs.hook }}"""
          fb_formatted = """${{ inputs.fb_formatted }}"""

          print(f"DEBUG PID length: {len(pid)} token length: {len(token)} mode: {mode}")

          if not pid:
              print("DANH SACH SECRETS/VARS HIEN CO:")
              print("Ban can vao GitHub Repo > Settings > Secrets and variables > Actions")
              print("Tao 2 cai nay cho kenh moi:")
              print("- FB_PAGE_TOKEN_THANH_LAM_3D_STUDIO (Secrets)")
              print("- FB_PAGE_ID_THANH_LAM_3D_STUDIO (Secrets hoac Variables)")
              raise RuntimeError(f"THIEU FB_PAGE_ID cho kenh {mode} - channel input = thanh_lam_3d_studio. Hay kiem tra GitHub Secrets/Variables.")

          if not token:
              raise RuntimeError(f"THIEU FB_TOKEN cho kenh")

          if fb_formatted and fb_formatted.strip() and fb_formatted != "null":
              desc = fb_formatted
          else:
              desc = f"{title}\n\n"
              if content_en: desc+= f"EN: {content_en}\n"
              if content_vi: desc+= f"VI: {content_vi}\n"
              if ipa: desc+= f"IPA: {ipa}\n"
              if vocab: desc+= f"Vocab: {vocab}\n"
              if hook: desc+= f"\n{hook}\n"
              if not content_en and script: desc+= f"\n{script}\n"
              desc+= "\n#SuTuEN #LearnEnglish"

          API = "https://graph.facebook.com/v19.0"

          if mode == "image_card":
              upload_url = f"{API}/{pid}/photos"
              print(f"Dang ANH len Page {pid}: {title}")
              with open("final.jpg", "rb") as f:
                  r = requests.post(upload_url, data={"caption": desc, "access_token": token, "published": "true"}, files={"source": ("final.jpg", f, "image/jpeg")}, timeout=600)
              print(f"FB Photo HTTP {r.status_code}\n{r.text}")
              data = r.json()
              if r.status_code >=400 or "error" in data:
                  raise RuntimeError(f"Facebook Photo upload FAILED: {data}")
              print(f"OK PHOTO ID: {data.get('id')}")
              sys.exit(0)

          upload_url = f"{API}/{pid}/videos"
          print(f"Dang video len Page {pid}: {title}")
          with open("final.mp4", "rb") as f:
              r = requests.post(upload_url, data={"title": title, "description": desc, "access_token": token, "published": "true"}, files={"source": ("final.mp4", f, "video/mp4")}, timeout=1800)
          print(f"FB Video HTTP {r.status_code}\n{r.text}")
          data = r.json()
          if r.status_code >=400 or "error" in data: raise RuntimeError(f"Facebook upload FAILED: {data}")
          vid = data.get("id")
          if not vid: raise RuntimeError(f"Khong co Video ID: {data}")
          print(f"Video ID: {vid}")
          check_url = f"{API}/{vid}"
          for attempt in range(1,25):
              time.sleep(10)
              check = requests.get(check_url, params={"fields":"id,status,published,permalink_url","access_token":token}, timeout=60)
              print(f"Check {attempt} - {check.text}")
              try: cd = check.json()
              except: continue
              if cd.get("published") is True:
                  print(f"OK VIDEO PUBLIC: {cd.get('permalink_url')}")
                  sys.exit(0)
          raise RuntimeError(f"VIDEO KHONG PUBLIC - ID={vid}")
          PY
