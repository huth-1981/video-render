name: Render and Post Video

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Chon kenh de dang'
        required: true
        type: choice
        options:
          - chuyen_tham_60s
          - sao_lai_the
          - viet_nam_nhin_tu_tren
          - song_khoe_sau_50
          - the_gioi_hoang_da_60s
          - loi_phat_day_1_phut
          - tien_trong_tui
      script:
        description: 'Noi dung kich ban'
        required: true
        type: string
      video_url:
        description: 'Link video Pexels hoac video render'
        required: false
        type: string
      title:
        description: 'Tieu de video'
        required: false
        type: string

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get correct Page Token
        id: get_token
        run: |
          echo "Kenh duoc chon: ${{ inputs.channel }}"
          case "${{ inputs.channel }}" in
            chuyen_tham_60s)
              echo "page_token=${{ secrets.FB_TOKEN_CHUYEN_THAM_60S }}" >> $GITHUB_OUTPUT
              echo "page_id=${{ vars.FB_PAGE_ID_CHUYEN_THAM_60S }}" >> $GITHUB_OUTPUT
              ;;
            sao_lai_the)
              echo "page_token=${{ secrets.FB_TOKEN_SAO_LAI_THE }}" >> $GITHUB_OUTPUT
              echo "page_id=${{ vars.FB_PAGE_ID_SAO_LAI_THE }}" >> $GITHUB_OUTPUT
              ;;
            viet_nam_nhin_tu_tren)
              echo "page_token=${{ secrets.FB_TOKEN_VIET_NAM_NHIN_TU_TREN }}" >> $GITHUB_OUTPUT
              ;;
            song_khoe_sau_50)
              echo "page_token=${{ secrets.FB_TOKEN_SONG_KHOE_SAU_50 }}" >> $GITHUB_OUTPUT
              ;;
            the_gioi_hoang_da_60s)
              echo "page_token=${{ secrets.FB_TOKEN_THE_GIOI_HOANG_DA_60S }}" >> $GITHUB_OUTPUT
              ;;
            loi_phat_day_1_phut)
              echo "page_token=${{ secrets.FB_TOKEN_LOI_PHAT_DAY_1_PHUT }}" >> $GITHUB_OUTPUT
              ;;
            tien_trong_tui)
              echo "page_token=${{ secrets.FB_TOKEN_TIEN_TRONG_TUI }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Kenh khong hop le!"
              exit 1
              ;;
          esac

      - name: Render video (vi du)
        run: |
          echo "Script: ${{ inputs.script }}"
          echo "Video URL: ${{ inputs.video_url }}"
          echo "Dang render cho kenh ${{ inputs.channel }}..."
          # Cho code render video cua ban vao day
          # ffmpeg, python main.py --script "${{ inputs.script }}" ...

      - name: Post to Facebook Page
        env:
          PAGE_TOKEN: ${{ steps.get_token.outputs.page_token }}
        run: |
          echo "Dang len Page..."
          # Vi du dang bai text, ban thay bang code dang video cua ban
          # curl -X POST "https://graph.facebook.com/v19.0/me/feed?message=${{ inputs.script }}&access_token=$PAGE_TOKEN"
          echo "Token da lay thanh cong cho kenh ${{ inputs.channel }}"
