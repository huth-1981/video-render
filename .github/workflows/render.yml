name: Render Video

on:
  workflow_dispatch:
    inputs:
      channel:
        required: true
        type: string
      video_url:
        required: true
        type: string
      title:
        required: true
        type: string
      script:
        required: true
        type: string
      caption:
        required: true
        type: string
      page_id:
        required: true
        type: string
      page_access_token:
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Download stock video
        run: |
          curl -L -o source.mp4 "${{ github.event.inputs.video_url }}"

      - name: Generate Vietnamese voice-over (edge-tts, free)
        run: |
          case "${{ github.event.inputs.channel }}" in
            sao) VOICE="vi-VN-NamMinhNeural" ;;
            *) VOICE="vi-VN-HoaiMyNeural" ;;
          esac
          echo "${{ github.event.inputs.script }}" > script.txt
          edge-tts --voice "$VOICE" --file script.txt --write-media voice.mp3

      - name: Download royalty-free music (Kevin MacLeod, CC BY 4.0)
        run: |
          case "${{ github.event.inputs.channel }}" in
            sao) URL="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Dark%20Star.mp3" ;;
            tham) URL="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Disquiet.mp3" ;;
            vn) URL="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Spring%20Thaw.mp3" ;;
          esac
          curl -L -o music.mp3 "$URL"

      - name: Loop video to voice length and merge voice + music
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 voice.mp3)
          ffmpeg -y -stream_loop -1 -i source.mp4 -i voice.mp3 -i music.mp3 \
            -filter_complex "[2:a]volume=0.18[m];[1:a][m]amix=inputs=2:duration=first:dropout_transition=2[a]" \
            -map 0:v -map "[a]" -t "$DUR" -c:v libx264 -preset fast -c:a aac -shortest final.mp4

      - name: Upload video to Facebook Page
        run: |
          CAPTION="${{ github.event.inputs.caption }}

          Music: Kevin MacLeod (incompetech.com), licensed under CC BY 4.0"
          curl -X POST "https://graph.facebook.com/v19.0/${{ github.event.inputs.page_id }}/videos" \
            -F "source=@final.mp4" \
            -F "description=$CAPTION" \
            -F "access_token=${{ github.event.inputs.page_access_token }}"
