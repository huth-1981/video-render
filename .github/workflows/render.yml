name: Render and Post Video
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Chon kenh'
        required: true
        type: choice
        options: [chuyen_tham_60s, sao_lai_the, viet_nam_nhin_tu_tren, song_khoe_sau_50, the_gioi_hoang_da_60s, loi_phat_day_1_phut, tien_trong_tui, thanh_lam_3d_studio, ha_thu_cartoon_studio, da_thuy_3d_studio]
      script: { description: 'Noi dung kich ban', required: true, type: string }
      video_url: { description: '1 hoac nhieu link Pexels cach nhau dau phay ,', required: true, type: string }
      title: { description: 'Tieu de video', required: true, type: string }

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install edge-tts requests

      - id: get_token
        run: |
          case "${{ inputs.channel }}" in
            chuyen_tham_60s) echo "page_token=${{ secrets.FB_TOKEN_CHUYEN_THAM_60S }}" >> $GITHUB_OUTPUT; echo "page_id=${{ vars.FB_PAGE_ID_CHUYEN_THAM_60S }}" >> $GITHUB_OUTPUT ;;
            sao_lai_the) echo "page_token=${{ secrets.FB_TOKEN_SAO_LAI_THE }}" >> $GITHUB_OUTPUT; echo "page_id=${{ vars.FB_PAGE_ID_SAO_LAI_THE }}" >> $GITHUB_OUTPUT ;;
            viet_nam_nhin_tu_tren) echo "page_token=${{ secrets.FB_TOKEN_VIET_NAM_NHIN_TU_TREN }}" >> $GITHUB_OUTPUT; echo "page_id=${{ vars.FB_PAGE_ID_VIET_NAM_NHIN_TU_TREN }}" >> $GITHUB_OUTPUT ;;
            song_khoe_sau_50) echo "page_token=${{ secrets.FB_TOKEN_SONG_KHOE_SAU_50 }}" >> $GITHUB_OUTPUT; echo "page_id=${{ vars.FB_PAGE_ID_SONG_KHOE_SAU_50 }}" >> $GITHUB_OUTPUT ;;
            the_gioi_hoang_da_60s) echo "page_token=${{ secrets.FB_TOKEN_THE_GIOI_HOANG_DA_60S }}" >> $GITHUB_OUTPUT; echo "page_id=${{ vars.FB_PAGE_ID_THE_GIOI_HOANG_DA_60S }}" >> $GITHUB_OUTPUT ;;
            loi_phat_day_1_phut) echo "page_token=${{ secrets.FB_TOKEN_LOI_PHAT_DAY_1_PHUT }}" >> $GITHUB_OUTPUT; echo "page_id=${{ vars.FB_PAGE_ID_LOI_PHAT_DAY_1_PHUT }}" >> $GITHUB_OUTPUT ;;
            tien_trong_tui) echo "page_token=${{ secrets.FB_TOKEN_TIEN_TRONG_TUI }}" >> $GITHUB_OUTPUT; echo "page_id=${{ vars.FB_PAGE_ID_TIEN_TRONG_TUI }}" >> $GITHUB_OUTPUT ;;
            thanh_lam_3d_studio) echo "page_token=${{ secrets.FB_PAGE_TOKEN_THANH_LAM_3D_STUDIO }}" >> $GITHUB_OUTPUT; echo "page_id=${{ secrets.FB_PAGE_ID_THANH_LAM_3D_STUDIO }}" >> $GITHUB_OUTPUT ;;
            ha_thu_cartoon_studio) echo "page_token=${{ secrets.FB_PAGE_TOKEN_HA_THU_CARTOON_STUDIO }}" >> $GITHUB_OUTPUT; echo "page_id=${{ secrets.FB_PAGE_ID_HA_THU_CARTOON_STUDIO }}" >> $GITHUB_OUTPUT ;;
            da_thuy_3d_studio) echo "page_token=${{ secrets.FB_PAGE_TOKEN_DA_THUY_3D_STUDIO }}" >> $GITHUB_OUTPUT; echo "page_id=${{ secrets.FB_PAGE_ID_DA_THUY_3D_STUDIO }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Render - Ghep 3 video & khong cat tieng
        run: |
          echo '${{ inputs.script }}' > script.txt
          edge-tts --voice vi-VN-HoaiMyNeural --text "$(cat script.txt)" --write-media voice.mp3
          
          echo "${{ inputs.video_url }}" | tr ',' '\n' > urls.txt
          rm -f list.txt
          i=0
          for url in $(cat urls.txt); do
            echo "Tai video $i: $url"
            curl -L -o clip_${i}_raw.mp4 $url
            ffmpeg -y -i clip_${i}_raw.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -pix_fmt yuv420p -an clip_${i}.mp4
            echo "file clip_${i}.mp4" >> list.txt
            i=$((i+1))
          done
          
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy bg_concat.mp4
          ffmpeg -y -stream_loop 10 -i bg_concat.mp4 -i voice.mp3 -shortest -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:a aac -c:v libx264 -pix_fmt yuv420p -max_muxing_queue_size 1024 final.mp4
          
      - name: Post - Cong khai cho moi nguoi xem
        env:
          PAGE_TOKEN: ${{ steps.get_token.outputs.page_token }}
          PAGE_ID: ${{ steps.get_token.outputs.page_id }}
        run: |
          python3 << 'PY'
          import requests, os, time, sys

          pid = os.environ.get("PAGE_ID", "").strip()
          token = os.environ.get("PAGE_TOKEN", "").strip()
          title = """${{ inputs.title }}"""
          script = """${{ inputs.script }}"""
          desc = f"{title}\n\n{script}\n\n#chuyentham60s"

          if not pid:
              raise RuntimeError("THIEU FB_PAGE_ID cho kenh nay.")
          if not token:
              raise RuntimeError("THIEU FB_TOKEN cho kenh nay.")

          API = "https://graph.facebook.com/v19.0"
          upload_url = f"{API}/{pid}/videos"

          print(f"Dang video len Facebook Page {pid}: {title}")
          print("Bat buoc published=true va se kiem tra den khi video thuc su public.")

          with open("final.mp4", "rb") as f:
              r = requests.post(
                  upload_url,
                  data={
                      "title": title,
                      "description": desc,
                      "access_token": token,
                      "published": "true",
                  },
                  files={"source": ("final.mp4", f, "video/mp4")},
                  timeout=1800,
              )

          print(f"Facebook upload HTTP {r.status_code}")
          print(r.text)

          try:
              data = r.json()
          except ValueError:
              raise RuntimeError("Facebook tra ve khong phai JSON.")

          if r.status_code >= 400:
              raise RuntimeError(f"Facebook upload FAILED: {data}")

          if "error" in data:
              raise RuntimeError(f"Facebook upload FAILED: {data['error']}")

          vid = data.get("id")
          if not vid:
              raise RuntimeError(f"Khong nhan duoc Video ID tu Facebook: {data}")

          print(f"Facebook da nhan video ID: {vid}")

          check_url = f"{API}/{vid}"
          max_attempts = 24
          wait_seconds = 10
          last_data = None

          for attempt in range(1, max_attempts + 1):
              time.sleep(wait_seconds)
              check = requests.get(
                  check_url,
                  params={
                      "fields": "id,status,published,permalink_url",
                      "access_token": token,
                  },
                  timeout=60,
              )
              print(f"Check {attempt}/{max_attempts} - HTTP {check.status_code}")
              print(check.text)
              if check.status_code >= 400:
                  last_data = {"http_status": check.status_code, "body": check.text}
                  continue
              try:
                  check_data = check.json()
              except ValueError:
                  last_data = {"body": check.text}
                  continue
              last_data = check_data
              if "error" in check_data:
                  continue
              published = check_data.get("published")
              status = check_data.get("status")
              if isinstance(status, dict):
                  video_status = (
                      status.get("video_status")
                      or status.get("processing_phase")
                      or status.get("status")
                      or str(status)
                  )
              else:
                  video_status = status
              print(f"Video status={video_status}; published={published}")
              if published is True:
                  print("OK: VIDEO DA DUOC PUBLISH CONG KHAI.")
                  if check_data.get("permalink_url"):
                      print(f"URL: {check_data['permalink_url']}")
                  sys.exit(0)

          raise RuntimeError(
              "VIDEO KHONG XAC NHAN DUOC LA CONG KHAI SAU THOI GIAN CHO. "
              f"Video ID={vid}; last_response={last_data}"
          )
          PY
